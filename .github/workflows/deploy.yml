name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push waits for the running deploy instead of cancelling it half way through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # The image CI builds is the one the server runs: it is pushed to ghcr.io tagged with the
  # commit, and the server only pulls it. The same gate as the deploy keeps an unconfigured
  # repository from filling the registry.
  image:
    needs: checks
    if: vars.RECIPES_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cnotv/recipes:${{ github.sha }}
            ghcr.io/cnotv/recipes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The app's own folder, relative to the SSH user's home unless absolute. Never the home
      # itself or a folder another app on the server uses: its compose file would be replaced.
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY || 'recipes' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scp-action creates the folder; this only refuses a name that is not the app's own.
      - name: Check the deploy folder
        run: |
          case "$DEPLOY_DIRECTORY" in
            '' | . | ./ | / | '~' | '~/' | *..*)
              echo "DEPLOY_DIRECTORY must name the app's own folder, not '$DEPLOY_DIRECTORY'" >&2
              exit 1 ;;
          esac

      # Both SSH actions hold the server key, so they are pinned to the exact commit of a
      # release rather than a tag that could be moved. Only the compose file is copied; the
      # data is in a named volume, not here.
      - name: Copy the compose file to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: docker-compose.cloud.yml
          target: ${{ env.DEPLOY_DIRECTORY }}

      # The settings are written on the server, so the secrets reach it only through the SSH
      # session, never a file on the runner or a command line. RECIPES_IMAGE_TAG pins the
      # server to the exact image this run pushed, so a rollback is a re-run of an older commit.
      - name: Write the settings, pull and start the new version
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RECIPES_IMAGE_TAG: ${{ github.sha }}
          RECIPES_DOMAIN: ${{ vars.RECIPES_DOMAIN }}
          RECIPES_PUBLISH_ADDRESS: ${{ vars.RECIPES_PUBLISH_ADDRESS || '127.0.0.1' }}
          RECIPES_PUBLISH_PORT: ${{ vars.RECIPES_PUBLISH_PORT }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RECIPES_ADMIN_TOKEN: ${{ secrets.RECIPES_ADMIN_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          envs: DEPLOY_DIRECTORY,RECIPES_IMAGE_TAG,RECIPES_DOMAIN,RECIPES_PUBLISH_ADDRESS,RECIPES_PUBLISH_PORT,OPENROUTER_MODEL,OPENROUTER_API_KEY,RECIPES_ADMIN_TOKEN,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            # Without this a failed pull still reports success, and the old container keeps
            # running behind a green deploy.
            set -e
            cd "$DEPLOY_DIRECTORY"

            # The file holds secrets, so it is private before anything is written to it, and
            # nothing below prints a value or turns on tracing.
            set +x
            umask 077
            touch .env
            chmod 600 .env
            : > .env

            RECIPES_ALLOWED_HOSTS="$RECIPES_DOMAIN,localhost,127.0.0.1,[::1]"
            RECIPES_SITE_URL="https://$RECIPES_DOMAIN"

            # Only the settings that have a value, so an unset key or model falls back to the
            # server's own default. Plain sh, whatever shell the SSH user has.
            newline='
            '
            for name in RECIPES_IMAGE_TAG RECIPES_DOMAIN RECIPES_PUBLISH_ADDRESS \
              RECIPES_PUBLISH_PORT RECIPES_ALLOWED_HOSTS RECIPES_SITE_URL OPENROUTER_MODEL \
              OPENROUTER_API_KEY RECIPES_ADMIN_TOKEN; do
              eval "value=\${$name}"
              [ -n "$value" ] || continue
              # Single quotes keep a value literal in .env, so one inside it would break out.
              case "$value" in
                *\'* | *"$newline"*)
                  echo "$name must not contain a quote or a line break" >&2
                  exit 1 ;;
              esac
              printf "%s='%s'\n" "$name" "$value" >> .env
            done

            # The registry token lives as long as this job, so log in for the pull and out
            # again. --wait fails the deploy if the new version never becomes healthy.
            echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
            docker compose --file docker-compose.cloud.yml pull app
            docker logout ghcr.io
            docker compose --file docker-compose.cloud.yml up --detach --no-build --remove-orphans --wait --wait-timeout 120
            docker image prune --force

      # Through the domain, so DNS, the proxy and the certificate are proved too.
      - name: Smoke test the app at its domain
        env:
          RECIPES_DOMAIN: ${{ vars.RECIPES_DOMAIN }}
        run: scripts/smoke-test.sh "https://$RECIPES_DOMAIN"
