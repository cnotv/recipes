name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up --build --wait
      - name: Health, app shell and every seeded recipe
        run: |
          curl --fail --silent http://127.0.0.1:4330/api/health
          curl --fail --silent http://127.0.0.1:4330/ | grep --quiet '<div id="app">'
          curl --fail --silent 'http://127.0.0.1:4330/api/recipes?pageSize=1' | tee list.json | jq --exit-status '.total == 27'
          slug=$(jq --raw-output '.items[0].slug' list.json)
          curl --fail --silent "http://127.0.0.1:4330/api/recipes/${slug}" | jq --exit-status '.languages.en.title'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # The compose file the Hetzner server runs, with a throwaway .env and no proxy in front.
  container-cloud:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.cloud.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write a test .env
        run: |
          cat > .env <<'EOF'
          RECIPES_DOMAIN=recipes.example.test
          RECIPES_PUBLISH_PORT=4331
          RECIPES_ALLOWED_HOSTS=recipes.example.test,localhost,127.0.0.1,[::1]
          RECIPES_SITE_URL=https://recipes.example.test
          OPENROUTER_MODEL=test-model
          OPENROUTER_API_KEY=test-key
          RECIPES_ADMIN_TOKEN=test-token
          EOF
      - run: docker compose up --build --wait
      - run: scripts/smoke-test.sh http://127.0.0.1:4331
      - name: The public host name is accepted
        run: |
          curl --fail --silent --header 'Host: recipes.example.test' http://127.0.0.1:4331/api/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
